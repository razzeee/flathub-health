name: Flathub health
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: flathub-health
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
      runner_revision: ${{ steps.runner.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - id: catalog
        run: echo "matrix=$(node scripts/catalog.ts)" >> "$GITHUB_OUTPUT"
      - id: runner
        run: |
          revision=$(node scripts/runner.ts)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  check:
    needs: catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: razzeee/flatpak-smoke
          ref: ${{ needs.catalog.outputs.runner_revision }}
          path: .runner
          persist-credentials: false
      - name: Install Flatpak tooling
        run: sudo apt-get update && sudo apt-get install -y flatpak
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --prod --frozen-lockfile
      - name: Begin app-check resource measurement
        id: measurement
        continue-on-error: true # Missing metrics must not suppress app validation.
        env:
          APP_ID: ${{ matrix.app_id }}
        run: node scripts/measure.ts start "$APP_ID"
      - name: Check released app and capture recipe
        env:
          APP_ID: ${{ matrix.app_id }}
        run: node scripts/run.ts --app "$APP_ID"
      - name: Record app-check resource measurement
        if: always() && steps.measurement.outcome == 'success'
        continue-on-error: true
        env:
          APP_ID: ${{ matrix.app_id }}
        run: node scripts/measure.ts finish "$APP_ID"
      - name: Upload logs and images
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: health-${{ matrix.app_id }}
          path: |
            artifacts/${{ matrix.app_id }}/
            !artifacts/${{ matrix.app_id }}/health.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload compact result record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: record-${{ matrix.app_id }}
          path: artifacts/${{ matrix.app_id }}/health.json
          if-no-files-found: warn
          retention-days: 14

  report:
    if: always()
    needs: [catalog, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --prod --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # aggregator must report missing jobs
        with:
          pattern: "{health-*,record-*}"
          path: downloads
      - name: Restore app directory names
        run: |
          mkdir -p artifacts
          for dir in downloads/health-*; do
            [ -d "$dir" ] || continue
            mv "$dir" "artifacts/${dir#downloads/health-}"
          done
          for dir in downloads/record-*; do
            [ -d "$dir" ] || continue
            app_id=${dir#downloads/record-}
            mkdir -p "artifacts/$app_id"
            [ ! -f "$dir/health.json" ] || cp "$dir/health.json" "artifacts/$app_id/health.json"
          done
      - name: Download recent retained result records
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          mkdir -p downloads/history
          gh run list --workflow check-apps.yml --limit 31 --json databaseId,status --jq '.[] | select(.status == "completed") | .databaseId' | while read -r run_id; do
            [ "$run_id" = "$CURRENT_RUN" ] && continue
            attempt=$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq .run_attempt)
            mkdir -p "downloads/history/$run_id"
            gh run download "$run_id" --repo "$GH_REPO" --name "history-$run_id-$attempt" --dir "downloads/history/$run_id" 2>/dev/null || printf '{"schema_version":1,"run_id":"%s","run_attempt":"%s","missing":true}\n' "$run_id" "$attempt" > "downloads/history/$run_id/missing.json"
          done
      - name: Aggregate expected jobs
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/report.ts --history downloads/history
      - name: Job summary
        if: always()
        run: cat artifacts/report/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: health-report
          path: artifacts/report/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: history-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/report/history.json
          if-no-files-found: error
          retention-days: 14

  publish-results:
    if: always() && needs.catalog.result == 'success' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [catalog, check, report]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: health-report
          path: downloads/report
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: health-*
          path: downloads
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --prod --frozen-lockfile
      - name: Build read-only results page
        # Runtime schema validation uses the same dependency as the reporter.
        run: node scripts/site.ts --report downloads/report/report.json --artifacts downloads --output site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@5f327015a708106f6f1b7c9a633901af30fe80cb
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
