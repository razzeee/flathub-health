name: Flathub health
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flathub-health
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
      runner_revision: ${{ steps.runner.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - id: catalog
        run: echo "matrix=$(node scripts/catalog.ts)" >> "$GITHUB_OUTPUT"
      - id: runner
        run: |
          revision=$(node scripts/runner.ts)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  check:
    needs: catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: razzeee/flatpak-smoke
          ref: ${{ needs.catalog.outputs.runner_revision }}
          path: .runner
          persist-credentials: false
      - name: Install Flatpak tooling
        run: sudo apt-get update && sudo apt-get install -y flatpak
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --prod --frozen-lockfile
      - name: Check released app and capture recipe
        env:
          APP_ID: ${{ matrix.app_id }}
        run: node scripts/run.ts --app "$APP_ID"
      - name: Upload all diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: health-${{ matrix.app_id }}
          path: artifacts/${{ matrix.app_id }}/
          if-no-files-found: error
          retention-days: 14

  report:
    if: always()
    needs: [catalog, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --prod --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # aggregator must report missing jobs
        with:
          pattern: health-*
          path: downloads
      - name: Restore app directory names
        run: |
          mkdir -p artifacts
          for dir in downloads/health-*; do
            [ -d "$dir" ] || continue
            mv "$dir" "artifacts/${dir#downloads/health-}"
          done
      - name: Aggregate expected jobs
        run: node scripts/report.ts
      - name: Job summary
        if: always()
        run: cat artifacts/report/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: health-report
          path: artifacts/report/
          if-no-files-found: error
          retention-days: 14
