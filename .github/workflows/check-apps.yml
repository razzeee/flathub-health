name: Flathub health
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flathub-health
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - id: catalog
        run: echo "matrix=$(node scripts/catalog.ts)" >> "$GITHUB_OUTPUT"

  check:
    needs: catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: razzeee/flatpak-smoke
          ref: 718df5b31ff138dec6b8361ae1eef535667db1cb # v0.1.1; keep runner.json in sync
          path: .runner
          persist-credentials: false
      - name: Install Flatpak tooling
        run: sudo apt-get update && sudo apt-get install -y flatpak
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --prod --frozen-lockfile
      - name: Check released app and capture recipe
        env:
          APP_ID: ${{ matrix.app_id }}
        run: node scripts/run.ts --app "$APP_ID"
      - name: Upload all diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: health-${{ matrix.app_id }}
          path: artifacts/${{ matrix.app_id }}/
          if-no-files-found: error
          retention-days: 14

  report:
    if: always()
    needs: [catalog, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --prod --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true # aggregator must report missing jobs
        with:
          pattern: health-*
          path: downloads
      - name: Restore app directory names
        run: |
          mkdir -p artifacts
          for dir in downloads/health-*; do
            [ -d "$dir" ] || continue
            mv "$dir" "artifacts/${dir#downloads/health-}"
          done
      - name: Aggregate expected jobs
        run: node scripts/report.ts
      - name: Job summary
        if: always()
        run: cat artifacts/report/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: health-report
          path: artifacts/report/
          if-no-files-found: error
          retention-days: 14
