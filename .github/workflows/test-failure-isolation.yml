name: Hosted failure-isolation test (opt-in)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RUN HOSTED FAILURE TEST to run isolated failure fixtures
        required: true
        type: string

permissions:
  contents: read

jobs:
  hosted-fixtures:
    if: ${{ inputs.confirm == 'RUN HOSTED FAILURE TEST' }}
    name: "Hosted fixture: ${{ matrix.case }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        case: [recipe-failure, unaffected-matrix, missing-artifact]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run isolated failure behavior tests
        run: pnpm test
      - name: Create fixture evidence (never an app-catalog artifact)
        if: always() && matrix.case != 'missing-artifact'
        env:
          CASE: ${{ matrix.case }}
        run: |
          mkdir -p hosted-fixtures
          printf 'case=%s\nrun=%s\n' "$CASE" "$GITHUB_RUN_ID" > "hosted-fixtures/$CASE.txt"
      - name: Upload hosted fixture evidence
        if: always() && matrix.case != 'missing-artifact'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-fixture-${{ matrix.case }}
          path: hosted-fixtures/
          if-no-files-found: error
          retention-days: 3

  verify-fixtures:
    if: ${{ always() && inputs.confirm == 'RUN HOSTED FAILURE TEST' }}
    needs: hosted-fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: hosted-fixture-*
          path: fixture-downloads
      - name: Confirm unaffected matrix evidence and missing evidence semantics
        run: |
          test -f fixture-downloads/hosted-fixture-unaffected-matrix/unaffected-matrix.txt
          test ! -e fixture-downloads/hosted-fixture-missing-artifact
          test -f fixture-downloads/hosted-fixture-recipe-failure/recipe-failure.txt
          echo 'Hosted fixture evidence is isolated from artifacts/ and the app catalog. The missing-artifact matrix case intentionally uploaded nothing.' >> "$GITHUB_STEP_SUMMARY"
