version: 1
setup:
  files:
    - source: fixtures/org.videolan.VLC/smoke-test.mp4
      destination: data/VLC-smoke-test.mp4
launch:
  args:
    - --no-one-instance
    - "${APP_DATA}/VLC-smoke-test.mp4"
window:
  title: VLC media player
  width: 900
  height: 600
steps:
  - wait_text: VLC-smoke-test.mp4
    timeout: 30s
  - capture:
      name: sample-video
      caption: Play a short silent test video
